name: 🐛 버그
description: 잘못 동작하는 것
title: "[Bug] "
labels: ["type: fix"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 생겼나요
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. 
        2. 
  - type: textarea
    id: expected
    attributes:
      label: 원래 기대한 동작
  - type: input
    id: env
    attributes:
      label: 기기 / 브라우저
      placeholder: 예) 아이폰 15 사파리, 갤럭시 S24 크롬
